name: TravelCompanion
options:
  bundleIdPrefix: com.yangzhiyuan
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.4.4
    CURRENT_PROJECT_VERSION: 66
packages:
  MapLibre:
    url: https://github.com/maplibre/maplibre-gl-native-distribution
    exactVersion: 6.25.1
targets:
  TravelCompanion:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/TravelCompanion
      - Assets.xcassets
    resources:
      - Sources/TravelCompanion/Supporting/PrivacyInfo.xcprivacy
    dependencies:
      - target: TravelCompanionShareExtension
        embed: true
      - package: MapLibre
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangzhiyuan.travelcompanion
        PRODUCT_NAME: TravelCompanion
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/TravelCompanion/Supporting/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/TravelCompanion/Supporting/TravelCompanion.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          CODE_SIGN_IDENTITY: "Apple Development"
          DEVELOPMENT_TEAM: 9Z29478796
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "A3E24240093D0924BC17227C32EFE18210630E32"
          DEVELOPMENT_TEAM: 9Z29478796
          PROVISIONING_PROFILE_SPECIFIER: "Indo Main Release SignIn 20260803"
  TravelCompanionShareExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Sources/TravelCompanionShareExtension
    resources:
      - Sources/TravelCompanionShareExtension/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangzhiyuan.travelcompanion.share
        PRODUCT_NAME: TravelCompanionShareExtension
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/TravelCompanionShareExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: Sources/TravelCompanionShareExtension/TravelCompanionShareExtension.entitlements
        TARGETED_DEVICE_FAMILY: "1"
      configs:
        Debug:
          CODE_SIGN_STYLE: Automatic
          DEVELOPMENT_TEAM: 9Z29478796
        Release:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "A3E24240093D0924BC17227C32EFE18210630E32"
          DEVELOPMENT_TEAM: 9Z29478796
          PROVISIONING_PROFILE_SPECIFIER: "TravelCompanion Share App Store"
  TravelCompanionTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - Tests/TravelCompanionTests
    dependencies:
      - target: TravelCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.yangzhiyuan.travelcompanion.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  TravelCompanion:
    build:
      targets:
        TravelCompanion: all
    run:
      config: Debug
    test:
      targets:
        - TravelCompanionTests
