# Installed by deployment/deploy.sh as an Nginx server-context snippet.
# The corresponding limit_req_zone belongs in
# /etc/nginx/conf.d/travel-companion-rate-limit-zones.conf.
# AI prompts can contain private travel data: disable request access logs and
# use the same body ceiling as Flask's default AI_MAX_REQUEST_BYTES (20 MiB).
# Keep these values aligned when changing either layer.
location = /v1/ai/itinerary-drafts {
    include /etc/nginx/snippets/travel-companion-ai-proxy.conf;
}

location = /v1/ai/itinerary-chat {
    include /etc/nginx/snippets/travel-companion-ai-proxy.conf;
}

location = /v1/ai/itinerary-chat/stream {
    include /etc/nginx/snippets/travel-companion-ai-proxy.conf;
    proxy_buffering off;
    proxy_cache off;
    gzip off;
}
