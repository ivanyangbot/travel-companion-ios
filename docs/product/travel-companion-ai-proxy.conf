# Shared proxy policy for AI endpoints. This file is included from the server
# context after the AI rate-limit locations are selected.
access_log off;
client_max_body_size 20m;
limit_req zone=travel_companion_ai burst=2 nodelay;
limit_req_status 429;

# Flask remains loopback-only; Nginx is the sole public entry point.
include /etc/nginx/snippets/travel-companion-proxy-params.conf;
proxy_pass http://127.0.0.1:5058;
